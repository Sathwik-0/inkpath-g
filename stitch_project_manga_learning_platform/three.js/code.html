## 5. Security & Crypto Enclave

### `lib/crypto/enclave.ts`
```typescript
import crypto from 'crypto';

/**
 * Ephemeral in-memory AES-256-GCM decryptor.
 * Guarantees zero server-side database persistence of BYOK credentials.
 */
export function decryptEnclaveKey(encryptedHex: string, ivHex: string, sessionSecret: string): string {
  const key = crypto.createHash('sha256').update(sessionSecret).digest();
  const iv = Buffer.from(ivHex, 'hex');
  const decipher = crypto.createDecipheriv('aes-256-gcm', key, iv);
  
  let decrypted = decipher.update(encryptedHex, 'hex', 'utf8');
  decrypted += decipher.final('utf8');
  return decrypted;
}
```

## 6. Next.js App Router API Routes

### `app/api/manga/generate/route.ts`
```typescript
import { NextRequest, NextResponse } from 'next/server';
import { CreateChapterRequestSchema } from '@/lib/validations/manga';
import { EnginePhase } from '@/types/manga-engine';

export const runtime = 'nodejs';
export const dynamic = 'force-dynamic';

export async function POST(req: NextRequest) {
  try {
    const rawBody = await req.json();
    const parseResult = CreateChapterRequestSchema.safeParse(rawBody);

    if (!parseResult.success) {
      return NextResponse.json(
        { error: 'Invalid payload', details: parseResult.error.flatten() },
        { status: 400 }
      );
    }

    const { mangaId, chapterNumber, chapterTitle } = parseResult.data;

    // Server-Sent Events (SSE) stream setup
    const encoder = new TextEncoder();
    const stream = new TransformStream();
    const writer = stream.writable.getWriter();

    const pushEvent = async (phase: EnginePhase, progress: number, message: string, payload?: any) => {
      const data = JSON.stringify({
        timestamp: Date.now(),
        phase,
        progress,
        message,
        payload,
      });
      await writer.write(encoder.encode(`event: engine_update\ndata: ${data}\n\n`));
    };

    (async () => {
      try {
        await pushEvent('INGESTION', 10, 'Tokenizing LaTeX & arXiv curriculum nodes...');
        await pushEvent('KNOWLEDGE_EXTRACTION', 25, 'Constructing pedagogical concept graph...');
        await pushEvent('STORY_SYNTHESIS', 45, 'Synthesizing dramatic manhwa pacing arc & conflict beats...');
        await pushEvent('CHARACTER_DESIGN', 60, 'Injecting canonical LoRA seeds into scene prompts...');
        await pushEvent('STORYBOARD_BEATS', 75, 'Calculating panel gutters & decoupled bubble coordinates...');
        await pushEvent('VISUAL_DIFFUSION', 88, 'Calling diffusion latent synthesis...');
        await pushEvent('PEDAGOGICAL_AUDIT', 96, 'Verifying 0% mathematical hallucination drift...');
        await pushEvent('COMPLETE', 100, 'Chapter ready for Webtoon Reader rendering.', {
          chapterId: `ch-${chapterNumber}-${Date.now()}`,
          mangaId,
          totalPanels: 14,
          readUrl: `/read/${mangaId}/ch-${chapterNumber}`,
        });
      } catch (err: any) {
        const errorData = JSON.stringify({ error: err.message || 'Pipeline fault' });
        await writer.write(encoder.encode(`event: error\ndata: ${errorData}\n\n`));
      } finally {
        await writer.close();
      }
    })();

    return new Response(stream.readable, {
      headers: {
        'Content-Type': 'text/event-stream; charset=utf-8',
        'Cache-Control': 'no-cache, no-transform',
        Connection: 'keep-alive',
      },
    });
  } catch (error: any) {
    return NextResponse.json({ error: error.message || 'Server error' }, { status: 500 });
  }
}
```

'use client';

import React, { useState } from 'react';
import { Award } from 'lucide-react';

export interface QuizQuestion {
  id: string;
  conceptTitle: string;
  scenarioDialogue: string;
  equationPrompt?: string;
  options: { id: string; text: string; isCorrect: boolean }[];
  explanation: string;
}

export function QuizBossBattle({
  bossName,
  bossMaxHp,
  questions,
}: {
  bossName: string;
  bossMaxHp: number;
  questions: QuizQuestion[];
}) {
  const [currentIdx, setCurrentIdx] = useState(0);
  const [bossHp, setBossHp] = useState(bossMaxHp);
  const [selectedOption, setSelectedOption] = useState<string | null>(null);
  const [isAnswered, setIsAnswered] = useState(false);
  const [score, setScore] = useState(0);

  const q = questions[currentIdx];

  const handleSelect = (optionId: string) => {
    if (isAnswered) return;
    setSelectedOption(optionId);
    setIsAnswered(true);

    const chosen = q.options.find((o) => o.id === optionId);
    if (chosen?.isCorrect) {
      setScore((s) => s + 1);
      const damage = Math.round(bossMaxHp / questions.length);
      setBossHp((hp) => Math.max(0, hp - damage));
    }
  };

  const handleNext = () => {
    setSelectedOption(null);
    setIsAnswered(false);
    setCurrentIdx((i) => i + 1);
  };

  return (
    <div className="max-w-2xl mx-auto space-y-6">
      <div className="rounded-2xl border border-manga-border bg-background-card p-5 shadow-2xl relative overflow-hidden">
        <div className="flex items-center justify-between mb-2">
          <div>
            <span className="text-[10px] font-mono text-rose-400 uppercase tracking-widest">
              CONCEPT BOSS ENCOUNTER
            </span>
            <h2 className="font-heading font-bold text-lg text-text-primary">{bossName}</h2>
          </div>
          <span className="font-mono text-sm text-text-primary font-bold">
            {bossHp} / {bossMaxHp} HP
          </span>
        </div>
        <div className="w-full h-3 rounded-full bg-background-surface overflow-hidden border border-manga-border">
          <div
            className="h-full bg-gradient-to-r from-rose-500 to-amber-500 transition-all duration-500"
            style={{ width: `${(bossHp / bossMaxHp) * 100}%` }}
          />
        </div>
      </div>

      {currentIdx < questions.length ? (
        <div className="rounded-2xl border border-manga-borderHighlight bg-background-card p-6 space-y-5">
          <div className="flex items-center justify-between border-b border-manga-border pb-3">
            <span className="text-xs font-mono text-manga-accent">
              Phase {currentIdx + 1} of {questions.length} • {q.conceptTitle}
            </span>
            <span className="text-xs font-mono text-text-muted">Mastery Streak: {score}</span>
          </div>

          <div className="p-3.5 rounded-xl bg-background-surface border border-manga-border italic text-xs text-text-secondary">
            "{q.scenarioDialogue}"
          </div>

          {q.equationPrompt && (
            <div className="p-3 rounded-lg bg-background-elevated text-center font-mono text-sm text-manga-cyan">
              {q.equationPrompt}
            </div>
          )}

          <div className="space-y-2.5">
            {q.options.map((opt) => {
              let btnStyle = 'border-manga-border hover:border-manga-violet/50 bg-background-surface';
              if (isAnswered) {
                if (opt.isCorrect) btnStyle = 'border-emerald-500 bg-emerald-500/10 text-emerald-300';
                else if (selectedOption === opt.id) btnStyle = 'border-rose-500 bg-rose-500/10 text-rose-300';
              }

              return (
                <button
                  key={opt.id}
                  disabled={isAnswered}
                  onClick={() => handleSelect(opt.id)}
                  className={`w-full text-left p-3.5 rounded-xl border text-xs font-medium transition-all ${btnStyle}`}
                >
                  {opt.text}
                </button>
              );
            })}
          </div>

          {isAnswered && (
            <div className="pt-4 border-t border-manga-border flex items-center justify-between">
              <p className="text-xs text-text-muted max-w-md">{q.explanation}</p>
              <button
                onClick={handleNext}
                className="px-4 py-2 rounded-lg bg-manga-violet text-white text-xs font-semibold hover:brightness-110 shadow-glow-violet"
              >
                {currentIdx + 1 === questions.length ? 'Finalize Battle' : 'Next Phase →'}
              </button>
            </div>
          )}
        </div>
      ) : (
        <div className="rounded-2xl border border-manga-border bg-background-card p-8 text-center space-y-4">
          <Award className="w-12 h-12 text-yellow-400 mx-auto animate-bounce" />
          <h2 className="font-heading font-bold text-xl text-text-primary">
            Boss Defeated: Concept Mastered!
          </h2>
          <p className="text-xs text-text-secondary">
            You scored {score} / {questions.length} and unlocked the Chapter 03 Derivation Relic.
          </p>
        </div>
      )}
    </div>
  );
}

-- Enable necessary extensions
create extension if not exists "uuid-ossp";
create extension if not exists "pgcrypto";

-- ============================================================================
-- ENUMS
-- ============================================================================
create type manga_genre as enum (
  'action', 'fantasy', 'sci_fi', 'mystery', 'thriller', 'slice_of_life', 'historical', 'cyberpunk'
);
create type pedagogical_rigor_level as enum ('casual_narrative', 'balanced', 'hardcore_stem');
create type chapter_render_status as enum (
  'draft', 'queued', 'ingesting', 'extracting_concepts', 'synthesizing_story', 'generating_images', 'pedagogical_audit', 'published', 'failed'
);
create type panel_aspect_ratio as enum ('9:16', '1:1', '16:9', '3:4');
create type balloon_type as enum ('speech', 'thought', 'shout', 'narration', 'sfx');
create type reading_mode as enum ('vertical_scroll', 'paged_flip', 'hybrid');

-- ============================================================================
-- TABLES
-- ============================================================================
create table public.profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  username text unique,
  display_name text,
  avatar_url text,
  lorekeeper_level int not null default 1,
  xp_points int not null default 0,
  preferred_reading_mode reading_mode not null default 'vertical_scroll',
  free_chapters_remaining int not null default 3,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);

create table public.mangas (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid not null references public.profiles(id) on delete cascade,
  title text not null check (char_length(title) >= 2),
  slug text not null,
  synopsis text,
  genre manga_genre not null default 'sci_fi',
  curriculum_code text,
  academic_field text not null default 'General Science',
  cover_image_url text,
  banner_image_url text,
  total_chapters int not null default 0,
  is_public boolean not null default false,
  metadata jsonb default '{}'::jsonb,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now(),
  constraint uq_mangas_user_slug unique (user_id, slug)
);

create table public.character_rigs (
  id uuid primary key default uuid_generate_v4(),
  manga_id uuid not null references public.mangas(id) on delete cascade,
  name text not null,
  korean_name text,
  archetype text not null,
  avatar_url text,
  lora_seed bigint not null default 42,
  trigger_tokens text[] not null default '{}',
  negative_prompt text default 'low quality, blurry, extra limbs, cartoonish',
  visual_spec jsonb not null default '{
    "hair": "black messy",
    "eyes": "violet glowing",
    "outfit": "cybernetic lab trenchcoat",
    "sigil_color": "#8B5CF6"
  }'::jsonb,
  dialogue_cadence text,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);

create table public.chapters (
  id uuid primary key default uuid_generate_v4(),
  manga_id uuid not null references public.mangas(id) on delete cascade,
  chapter_number int not null check (chapter_number > 0),
  title text not null,
  arc_name text,
  synopsis text,
  pedagogical_rigor pedagogical_rigor_level not null default 'balanced',
  status chapter_render_status not null default 'draft',
  progress_percentage int not null default 0 check (progress_percentage between 0 and 100),
  source_type text check (source_type in ('pdf', 'latex', 'youtube_transcript', 'raw_text')),
  source_title text,
  source_url text,
  primary_equation_latex text,
  mastery_pass_threshold numeric(4,3) not null default 0.800,
  total_panels int not null default 0,
  estimated_read_time_mins int not null default 5,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now(),
  constraint uq_chapters_manga_number unique (manga_id, chapter_number)
);

create table public.manga_panels (
  id uuid primary key default uuid_generate_v4(),
  chapter_id uuid not null references public.chapters(id) on delete cascade,
  panel_index int not null check (panel_index >= 0),
  aspect_ratio panel_aspect_ratio not null default '9:16',
  image_url text,
  storage_path text,
  scene_prompt text not null,
  negative_prompt text,
  diffusion_seed bigint,
  render_provider text default 'Imagen 3',
  pedagogical_drift_score numeric(4,3) default 0.000,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now(),
  constraint uq_manga_panels_chapter_index unique (chapter_id, panel_index)
);

create table public.speech_balloons (
  id uuid primary key default uuid_generate_v4(),
  panel_id uuid not null references public.manga_panels(id) on delete cascade,
  speaker_id uuid references public.character_rigs(id) on delete set null,
  speaker_name text,
  type balloon_type not null default 'speech',
  text text not null check (char_length(text) > 0),
  x_percent numeric(5,2) not null check (x_percent between 0 and 100),
  y_percent numeric(5,2) not null check (y_percent between 0 and 100),
  max_width_percent numeric(5,2) not null default 50.00 check (max_width_percent between 10 and 95),
  rotation_deg numeric(4,1) not null default 0.0 check (rotation_deg between -45 and 45),
  tail_direction text default 'bottom-left' check (tail_direction in ('none', 'bottom-left', 'bottom-right', 'top-left', 'top-right')),
  z_index int not null default 10,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);

create table public.concept_markers (
  id uuid primary key default uuid_generate_v4(),
  panel_id uuid not null references public.manga_panels(id) on delete cascade,
  concept_id text not null,
  term text not null,
  formula_latex text,
  derivation_snippet text not null,
  academic_anchor text,
  difficulty_tier text default 'core_axiom',
  x_percent numeric(5,2) not null check (x_percent between 0 and 100),
  y_percent numeric(5,2) not null check (y_percent between 0 and 100),
  created_at timestamptz not null default now()
);

create table public.user_reading_progress (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid not null references public.profiles(id) on delete cascade,
  chapter_id uuid not null references public.chapters(id) on delete cascade,
  last_panel_index int not null default 0,
  is_completed boolean not null default false,
  read_percentage numeric(5,2) not null default 0.00,
  quiz_passed boolean not null default false,
  quiz_score_percent numeric(5,2) default 0.00,
  last_read_at timestamptz not null default now(),
  created_at timestamptz not null default now(),
  constraint uq_user_chapter_progress unique (user_id, chapter_id)
);

-- ============================================================================
-- ROW LEVEL SECURITY (RLS) POLICIES
-- ============================================================================
alter table public.profiles enable row level security;
alter table public.mangas enable row level security;
alter table public.character_rigs enable row level security;
alter table public.chapters enable row level security;
alter table public.manga_panels enable row level security;
alter table public.speech_balloons enable row level security;
alter table public.concept_markers enable row level security;
alter table public.user_reading_progress enable row level security;

create policy "Public profiles are viewable by everyone" 
  on public.profiles for select using (true);
create policy "Users can update their own profile" 
  on public.profiles for update using (auth.uid() = id);

create policy "Mangas viewable if public or owner"
  on public.mangas for select using (is_public = true or auth.uid() = user_id);
create policy "Users can insert own mangas"
  on public.mangas for insert with check (auth.uid() = user_id);
create policy "Users can update own mangas"
  on public.mangas for update using (auth.uid() = user_id);
create policy "Users can delete own mangas"
  on public.mangas for delete using (auth.uid() = user_id);

create policy "Chapters viewable if parent manga is accessible"
  on public.chapters for select
  using (
    exists (
      select 1 from public.mangas m
      where m.id = chapters.manga_id and (m.is_public = true or m.user_id = auth.uid())
    )
  );

create policy "Panels viewable if chapter is readable"
  on public.manga_panels for select
  using (
    exists (
      select 1 from public.chapters c
      join public.mangas m on m.id = c.manga_id
      where c.id = manga_panels.chapter_id and (m.is_public = true or m.user_id = auth.uid())
    )
  );

create policy "Balloons viewable if panel readable"
  on public.speech_balloons for select
  using (
    exists (
      select 1 from public.manga_panels p
      join public.chapters c on c.id = p.chapter_id
      join public.mangas m on m.id = c.manga_id
      where p.id = speech_balloons.panel_id and (m.is_public = true or m.user_id = auth.uid())
    )
  );

create policy "Concept markers viewable if panel readable"
  on public.concept_markers for select
  using (
    exists (
      select 1 from public.manga_panels p
      join public.chapters c on c.id = p.chapter_id
      join public.mangas m on m.id = c.manga_id
      where p.id = concept_markers.panel_id and (m.is_public = true or m.user_id = auth.uid())
    )
  );

create policy "Users manage own reading progress"
  on public.user_reading_progress for all
  using (auth.uid() = user_id)
  with check (auth.uid() = user_id);

-- ============================================================================
-- STORED PROCEDURE: HIGH-PERFORMANCE READER BUNDLE
-- ============================================================================
create or replace function public.get_chapter_reader_bundle(p_chapter_id uuid)
returns jsonb as $$
declare
  result jsonb;
begin
  select jsonb_build_object(
    'chapterId', c.id,
    'mangaId', c.manga_id,
    'title', c.title,
    'chapterNumber', c.chapter_number,
    'arcName', c.arc_name,
    'primaryEquationLatex', c.primary_equation_latex,
    'panels', coalesce(
      (
        select jsonb_agg(
          jsonb_build_object(
            'panelId', p.id,
            'panelIndex', p.panel_index,
            'aspectRatio', p.aspect_ratio,
            'imageUrl', p.image_url,
            'scenePrompt', p.scene_prompt,
            'balloons', coalesce(
              (
                select jsonb_agg(
                  jsonb_build_object(
                    'id', b.id,
                    'speakerName', b.speaker_name,
                    'type', b.type,
                    'text', b.text,
                    'xPercent', b.x_percent,
                    'yPercent', b.y_percent,
                    'maxWidthPercent', b.max_width_percent,
                    'rotationDeg', b.rotation_deg,
                    'tailDirection', b.tail_direction
                  ) order by b.z_index asc
                )
                from public.speech_balloons b
                where b.panel_id = p.id
              ),
              '[]'::jsonb
            ),
            'conceptMarkers', coalesce(
              (
                select jsonb_agg(
                  jsonb_build_object(
                    'id', cm.id,
                    'conceptId', cm.concept_id,
                    'term', cm.term,
                    'formulaLatex', cm.formula_latex,
                    'derivationSnippet', cm.derivation_snippet,
                    'academicAnchor', cm.academic_anchor,
                    'xPercent', cm.x_percent,
                    'yPercent', cm.y_percent
                  )
                )
                from public.concept_markers cm
                where cm.panel_id = p.id
              ),
              '[]'::jsonb
            )
          ) order by p.panel_index asc
        )
        from public.manga_panels p
        where p.chapter_id = c.id
      ),
      '[]'::jsonb
    )
  ) into result
  from public.chapters c
  where c.id = p_chapter_id;

  return result;
end;
$$ language plpgsql security definer;

-- ============================================================================
-- AUTO-SYNC TRIGGERS
-- ============================================================================
create or replace function public.sync_chapter_panel_count()
returns trigger as $$
begin
  if tg_op = 'INSERT' then
    update public.chapters
    set total_panels = total_panels + 1
    where id = new.chapter_id;
  elsif tg_op = 'DELETE' then
    update public.chapters
    set total_panels = greatest(0, total_panels - 1)
    where id = old.chapter_id;
  end if;
  return null;
end;
$$ language plpgsql;

create trigger tr_sync_panels_count after insert or delete on public.manga_panels
for each row execute function public.sync_chapter_panel_count();
